services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: blackbird-backend

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/blackbird
      dockerfile: ../Dockerfile

    container_name: blackbird-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped
